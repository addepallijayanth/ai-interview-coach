name: AI eval

# Runs the match-quality eval against the real Claude API (about $0.50 per run). Manual trigger only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test -Peval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Publish the report
        if: always()
        run: cat target/eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
