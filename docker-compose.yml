# Local stack: PostgreSQL + Spring Boot API + React (nginx) + Mailpit. Open http://localhost:3000
#
#   cp .env.example .env    # add your ANTHROPIC_API_KEY
#   docker compose up --build
#
# Confirmation and password-reset emails are caught by Mailpit: read them at http://localhost:8025
#
# No API key? Use the mock Claude API instead:
#   ANTHROPIC_BASE_URL=http://mock-claude:8089 ANTHROPIC_API_KEY=mock docker compose --profile mock up --build

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  # A local inbox for every email the app sends (nothing leaves your machine).
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/coach
      DB_USERNAME: coach
      DB_PASSWORD: coach
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Mailpit by default; set these in .env to send real email through your SMTP provider instead.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-AI Interview Coach <no-reply@example.com>}
      AI_DAILY_SPEND_CAP_USD: ${AI_DAILY_SPEND_CAP_USD:-5.00}
      AI_REQUESTS_PER_USER_PER_DAY: ${AI_REQUESTS_PER_USER_PER_DAY:-150}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Optional stand-in for the Claude API (see dev/mock-claude.mjs). Enabled with --profile mock.
  mock-claude:
    image: node:24-alpine
    profiles: ["mock"]
    command: ["node", "/app/mock-claude.mjs"]
    volumes:
      - ./dev/mock-claude.mjs:/app/mock-claude.mjs:ro
    ports:
      - "8089:8089"

volumes:
  db-data:
